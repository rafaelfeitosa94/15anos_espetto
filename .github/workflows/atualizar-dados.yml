name: Atualizar dados (gateway)

# Consulta o SQL Server pelo on-premises data gateway (fluxo do Power Automate),
# regrava data/dados.json e faz commit — a Vercel publica automaticamente a cada push.
on:
  schedule:
    # 13:30 em São Paulo (UTC-3) = 16:30 UTC. O GitHub pode atrasar alguns minutos.
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Data inicial (AAAA-MM-DD). Vazio = início da ação (2026-10-15)'
        required: false
      fim:
        description: 'Data final (AAAA-MM-DD). Vazio = hoje (limitado a 2026-11-30)'
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verificar período da ação
        id: periodo
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%F)
          # roda de 15/10 até 01/12 (o dia 30/11 entra no banco no dia seguinte); manual roda sempre
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [[ "$hoje" > "2026-10-14" ]] && [[ "$hoje" < "2026-12-02" ]]; }; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fora do período da ação ($hoje); nada a fazer."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.periodo.outputs.rodar == 'true'

      - uses: actions/setup-node@v4
        if: steps.periodo.outputs.rodar == 'true'
        with:
          node-version: 20

      - name: Consultar gateway e gerar data/dados.json
        if: steps.periodo.outputs.rodar == 'true'
        id: consulta
        continue-on-error: true
        env:
          FLOW_URL: ${{ secrets.FLOW_URL }}
          INICIO: ${{ github.event.inputs.inicio }}
          FIM: ${{ github.event.inputs.fim }}
        run: node scripts/atualizar-gateway.js

      - name: Publicar (commit e push)
        if: steps.periodo.outputs.rodar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dados.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "dados: atualização via gateway $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase -X theirs
            git push
          fi

      - name: Falhar se o gateway falhou
        if: steps.consulta.outcome == 'failure'
        run: |
          echo "::error::A consulta ao gateway falhou. Veja o aviso no dashboard (pode ser necessário reautenticar a conexão no Power Automate)."
          exit 1
