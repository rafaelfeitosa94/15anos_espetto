name: Atualizar dados

# Roda no runner do GitHub instalado na rede da empresa (SRVTESTE), que acessa o SQL Server AD01\BARTENDER.
# Consulta a procedure dbo.sp_dashboard_copo15, regrava data/dados.json e publica pela API do GitHub;
# a Vercel publica automaticamente a cada commit.
on:
  push:
    branches: [main]
    paths:
      - 'lib/consolidar.js'
      - 'scripts/atualizar-sql.js'
      - 'scripts/exec-comandas.ps1'
      - '.github/workflows/atualizar-dados.yml'
  schedule:
    # Todo dia às 14h40 (São Paulo, UTC-3) = 17h40 UTC, depois da carga do Fabric. O GitHub pode atrasar alguns minutos.
    # As execuções de hora em hora (11h40 às 23h40) são disparadas pela tarefa agendada do SRVTESTE
    # (runner/agendar_atualizacao.ps1), que não sofre os atrasos do agendador do GitHub.
    - cron: '40 17 * * *'
  workflow_dispatch:   # disparado pela tarefa do SRVTESTE e pelo botão "Atualizar dados" do dashboard
    inputs:
      inicio:
        description: 'Data inicial (AAAA-MM-DD). Vazio = início da ação (2026-10-15)'
        required: false
      fim:
        description: 'Data final (AAAA-MM-DD). Vazio = hoje (limitado a 2026-11-30)'
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: [self-hosted, windows, sqlserver]
    timeout-minutes: 30
    # Os passos usam um shell PowerShell com -ExecutionPolicy Bypass porque a política de execução
    # do SRVTESTE é "Restricted" (bloqueia os scripts temporários que o Actions cria). Vale só para
    # o processo do passo; a política do servidor não é alterada.
    steps:
      - name: Verificar período da ação
        id: periodo
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $hoje = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([datetime]::UtcNow, 'E. South America Standard Time').ToString('yyyy-MM-dd')
          # agenda roda de 15/10 até 01/12 (o dia 30/11 termina de entrar no banco no dia seguinte); manual roda sempre
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -or ($hoje -ge '2026-10-15' -and $hoje -le '2026-12-01')) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "rodar=true" -Encoding Ascii
          } else {
            Write-Host "Fora do período da ação ($hoje); nada a fazer."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "rodar=false" -Encoding Ascii
          }

      - uses: actions/checkout@v4
        if: steps.periodo.outputs.rodar == 'true'

      - uses: actions/setup-node@v4
        if: steps.periodo.outputs.rodar == 'true'
        with:
          node-version: 20

      - name: Consultar SQL Server e publicar data/dados.json
        if: steps.periodo.outputs.rodar == 'true'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INICIO: ${{ github.event.inputs.inicio }}
          FIM: ${{ github.event.inputs.fim }}
        run: node scripts/atualizar-sql.js
